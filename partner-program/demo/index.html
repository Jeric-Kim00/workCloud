<title>Timely Partner Network</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="components/bundle.css">
<style>
/* 타임리 AI 디자인 시스템(components/bundle.css)의 토큰과 글자 클래스만 쓴다.
   레이아웃: 공개 화면은 가운데 1080px 단, 관리자 화면은 앱 대시보드 틀(사이드바 200 + 본문). */
:root {
  --page-max: 1080px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
body { background: var(--color-bg-lighter); color: var(--color-text-default); font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: -0.4px; word-break: keep-all; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--color-bg-default); }
#app { min-height: 100%; }
.wrap { max-width: var(--page-max); margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--color-bg-default); border-bottom: 1px solid var(--color-borders-default); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; max-width: none; }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--color-text-default); font: inherit; white-space: nowrap; }
.brand-mark { width: 24px; height: 24px; border-radius: 8px; background: var(--color-primary-default); color: var(--color-text-button-fill-text); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.nav { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow-x: auto; }
.nav-link { background: none; border: 0; cursor: pointer; padding: 8px 10px; border-radius: 8px; color: var(--color-text-light); font: inherit; white-space: nowrap; }
.nav-link:hover { background: var(--color-gray-light); }
.nav-link[aria-current="page"] { background: var(--color-primary-light-ghost); color: var(--color-text-primary); font-weight: 700; }
:focus-visible { outline: 2px solid var(--color-borders-primary); outline-offset: 2px; }

.section { padding-block: 56px; }
.section.white { background: var(--color-bg-default); border-block: 1px solid var(--color-borders-default); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--color-text-light); }
.neutral { color: var(--color-text-neutral); }
.primary-text { color: var(--color-text-primary); }
.title { text-wrap: balance; }
.eyebrow { color: var(--color-text-primary); }
.lead { max-width: 640px; }
.num { font-variant-numeric: tabular-nums; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.box { background: var(--color-bg-default); border: 1px solid var(--color-borders-default); border-radius: 16px; padding: 24px; min-width: 0; }
.box.tight { padding: 20px; }
.box.selected { border-color: var(--color-borders-primary); }
.hero { padding-block: 64px 56px; }
.entry { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.tier-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; list-style: disc; }
.grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.req { border-top: 1px solid var(--color-borders-default); padding-top: 12px; margin-top: auto; }
.tier { display: flex; flex-direction: column; gap: 12px; }
.step-no { width: 28px; height: 28px; border-radius: 50%; background: var(--color-primary-light-ghost); color: var(--color-text-primary); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.step { display: flex; gap: 12px; align-items: flex-start; }

.notice { border-radius: 16px; padding: 16px 20px; background: var(--color-informative-light-ghost); color: var(--color-text-informative); }
.notice.warn { background: var(--color-warning-light-ghost); color: var(--color-text-warning); }
.notice.ok { background: var(--color-success-light-ghost); color: var(--color-text-success); }
.notice.danger { background: var(--color-danger-light-ghost); color: var(--color-text-danger); }
.notice .body { color: var(--color-text-default); }

.form-grid { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.form-section { display: flex; flex-direction: column; gap: 20px; }
.form-section + .form-section { border-top: 1px solid var(--color-borders-default); padding-top: 28px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.textarea { width: 100%; min-height: 104px; resize: vertical; border: 1px solid var(--color-borders-default); border-radius: 8px; background: var(--color-bg-default); color: var(--color-text-default); padding: 12px; font: inherit; font-size: 14px; line-height: 20px; letter-spacing: -0.4px; }
.textarea:focus { outline: none; border-color: var(--color-borders-primary); }
.textarea::placeholder { color: var(--color-text-neutral); }
.native { width: 100%; height: 40px; border: 1px solid var(--color-borders-default); border-radius: 8px; background: var(--color-bg-default); color: var(--color-text-default); padding: 0 12px; font: inherit; font-size: 14px; }
.native:focus { outline: none; border-color: var(--color-borders-primary); }

.table-scroll { overflow-x: auto; border: 1px solid var(--color-borders-default); border-radius: 16px; background: var(--color-bg-default); }
.table-scroll table { min-width: 100%; }
.table-scroll td, .table-scroll th { white-space: nowrap; }
.table-scroll td.wrap-cell { white-space: normal; min-width: 220px; }
.clickable { cursor: pointer; }
.clickable:hover td { background: var(--color-gray-light); }
.empty { padding: 40px 16px; text-align: center; color: var(--color-text-light); }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--color-bg-default); border: 1px solid var(--color-borders-default); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.progress { height: 8px; border-radius: 999px; background: var(--color-gray-default); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--color-primary-default); }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 16px; }
.kv dt { color: var(--color-text-light); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

.faq details { background: var(--color-bg-default); border: 1px solid var(--color-borders-default); border-radius: 16px; padding: 16px 20px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq details p { margin: 8px 0 0; }

/* 관리자: 앱 대시보드 틀 */
.admin-shell { display: flex; align-items: stretch; min-height: calc(100vh - 61px); }
.admin-side { flex: none; }
.admin-main { flex: 1 1 0; min-width: 0; padding: 32px max(32px, var(--gutter-r)) 80px 32px; display: flex; flex-direction: column; gap: 16px; }
.admin-tabs { display: none; }
.tabs-line { display: flex; gap: 8px; align-items: flex-start; border-bottom: 1px solid var(--color-borders-default); width: 100%; overflow-x: auto; }
.portal-head { display: flex; flex-direction: column; gap: 4px; }

@media (max-width: 1023px) {
  .admin-side { display: none; }
  .admin-tabs { display: block; padding: 12px var(--gutter-r) 0 var(--gutter-l); background: var(--color-bg-default); border-bottom: 1px solid var(--color-borders-default); overflow-x: auto; }
  .admin-shell { flex-direction: column; }
  .admin-main { padding: 24px var(--gutter-r) 64px var(--gutter-l); }
}
@media (max-width: 720px) {
  .form-grid { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 10px; }
  .section { padding-block: 40px; }
  .hero { padding-block: 40px; }
  .nav .nav-link.secondary, .brand-text { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
  // 뷰어가 테마를 직접 고르지 않은 경우(속성 없음) 시스템 다크 설정을 디자인 시스템 테마로 옮긴다.
  (function () {
    var root = document.documentElement, mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    var mine = false;
    function sync() {
      if (root.hasAttribute('data-theme') && !mine) return;
      if (mq && mq.matches) { root.setAttribute('data-theme', 'dark'); mine = true; }
      else if (mine) { root.removeAttribute('data-theme'); mine = false; }
    }
    sync();
    if (mq && mq.addEventListener) mq.addEventListener('change', sync);
    new MutationObserver(function () {
      if (mine && root.getAttribute('data-theme') !== 'dark') mine = false;
    }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
(function () {
  var T = window.Timely, h = React.createElement, F = React.Fragment;
  var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo;

  /* ───────── 정책 (partner-program/benchmark.md 5장) ───────── */
  var TIERS = [
    { name: 'Registered', min: 0, people: 1, tech: 0, refs: 0, desc: '신규 파트너 기본 등급' },
    { name: 'Advanced', min: 100000000, people: 2, tech: 1, refs: 1, desc: '실적 검증 파트너' },
    { name: 'Premier', min: 500000000, people: 4, tech: 2, refs: 3, desc: '전략 파트너' }
  ];
  var BANDS = [
    { label: '5천만 원 미만', rate: '5%' },
    { label: '5천만 원 이상 ~ 2억 원 미만', rate: '8%' },
    { label: '2억 원 이상 ~ 5억 원 미만', rate: '12%' },
    { label: '5억 원 이상 ~ 10억 원 미만', rate: '15%' },
    { label: '10억 원 이상', rate: '별도 협의' }
  ];
  function discountRate(amount) {
    if (amount >= 1000000000) return null;
    if (amount >= 500000000) return 0.15;
    if (amount >= 200000000) return 0.12;
    if (amount >= 50000000) return 0.08;
    return 0.05;
  }
  var STAGES = ['발굴', '제안', 'PoC', '협상', '계약 완료'];
  var SEGMENTS = ['기업 (B2B2C)', '공공기관 (B2G2C)'];

  /* ───────── 공용 도우미 ───────── */
  function won(n) {
    n = Number(n) || 0;
    if (n >= 100000000) return (n / 100000000).toFixed(2).replace(/\.?0+$/, '') + '억 원';
    if (n === 0) return '0원';
    return Math.round(n / 10000).toLocaleString('ko-KR') + '만 원';
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, days) { var t = new Date(iso + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + days); return t.toISOString().slice(0, 10); }
  function shortDate(iso) { return iso ? String(iso).slice(0, 10) : '-'; }
  function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function opts(list) { return list.map(function (v) { return { label: v, value: v }; }); }
  function errText(e) {
    var c = e && e.code;
    if (c === 'quota_exceeded') return '저장 공간이 가득 찼어요. 관리자에게 알려 주세요.';
    if (c === 'invalid_argument') return '저장할 권한이 없거나 입력값이 올바르지 않아요.';
    if (c === 'resource_exhausted') return '요청이 많아요. 잠시 후 다시 시도해 주세요.';
    return '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
  }

  /* ───────── 플랫폼 연결: db(공유 저장소)·user(보는 사람) ───────── */
  var platform = { ready: false, db: null, user: null, uid: null, canEdit: false, listeners: [] };
  function usePlatform() {
    var s = useState(platform.ready ? 1 : 0), set = s[1];
    useEffect(function () {
      if (platform.ready) return;
      var fn = function () { set(1); };
      platform.listeners.push(fn);
      return function () { platform.listeners = platform.listeners.filter(function (x) { return x !== fn; }); };
    }, []);
    return platform;
  }
  (async function boot() {
    try {
      var c = window.claude;
      if (c && c.use) {
        var res = await Promise.all([c.use('db'), c.use('user')]);
        platform.db = res[0]; platform.user = res[1];
        if (platform.user) {
          platform.uid = await platform.user.id();
          platform.canEdit = await platform.user.canEdit();
        }
      }
    } catch (e) {}
    platform.ready = true;
    platform.listeners.forEach(function (fn) { fn(); });
  })();

  function useDoc(path) {
    var s = useState({ loading: true, data: null }), st = s[0], set = s[1];
    useEffect(function () {
      if (!path || !platform.db) { set({ loading: !platform.ready, data: null }); return; }
      var off = platform.db.doc(path).onSnapshot(function (snap) {
        set({ loading: false, data: snap.exists ? snap.data() : null });
      }, function () { set({ loading: false, data: null, error: true }); });
      return off;
    }, [path, platform.ready]);
    return st;
  }
  function useCol(path, order) {
    var s = useState({ loading: true, rows: [] }), st = s[0], set = s[1];
    useEffect(function () {
      if (!path || !platform.db) { set({ loading: !platform.ready, rows: [] }); return; }
      var q = platform.db.collection(path);
      if (order) q = q.orderBy(order[0], order[1]);
      var off = q.limit(500).onSnapshot(function (snap) {
        set({ loading: false, rows: snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }) });
      }, function () { set({ loading: false, rows: [], error: true }); });
      return off;
    }, [path, platform.ready]);
    return st;
  }
  // 여러 파트너의 하위 컬렉션을 한꺼번에 구독한다(관리자 화면).
  function useMany(paths) {
    var key = paths.join('|');
    var s = useState({}), st = s[0], set = s[1];
    useEffect(function () {
      if (!platform.db) return;
      var offs = paths.map(function (p) {
        return platform.db.collection(p).limit(500).onSnapshot(function (snap) {
          var rows = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
          set(function (prev) { var n = Object.assign({}, prev); n[p] = rows; return n; });
        }, function () {});
      });
      return function () { offs.forEach(function (f) { f(); }); };
    }, [key, platform.ready]);
    return st;
  }
  function useNames(ids) {
    var key = ids.filter(Boolean).sort().join('|');
    var s = useState({}), st = s[0], set = s[1];
    useEffect(function () {
      if (!platform.user || !key) return;
      var alive = true;
      platform.user.profiles(key.split('|')).then(function (ps) { if (alive) set(ps); });
      return function () { alive = false; };
    }, [key, platform.ready]);
    return function (id) { return (st[id] && st[id].name) || '구성원'; };
  }

  /* ───────── 딜 계산 ───────── */
  // 본사가 '합산'으로 판단한 딜끼리 Timely AI 금액을 합쳐 할인 구간을 정한다.
  function enrichDeals(deals, reviews) {
    var byId = {};
    var list = deals.map(function (d) {
      var r = reviews[d.id] || {};
      var x = Object.assign({}, d, { review: r });
      byId[d.id] = x;
      return x;
    });
    function root(d) {
      var seen = {};
      while (d && d.review.merge === '합산' && d.review.mergeWith && byId[d.review.mergeWith] && !seen[d.id]) { seen[d.id] = 1; d = byId[d.review.mergeWith]; }
      return d;
    }
    list.forEach(function (d) {
      var r = root(d).id;
      var group = list.filter(function (x) { return root(x).id === r; });
      d.bandBase = group.reduce(function (a, x) { return a + (Number(x.ai) || 0); }, 0);
      d.mergeLabel = group.length > 1 ? '합산' : d.review.merge === '개별' ? '개별' : '본사 검토 전';
      d.aiRate = d.ai ? discountRate(d.bandBase) : undefined;
      d.protectEnd = r && d.review.approvedAt ? addDays(d.review.approvedAt, d.review.extended ? 180 : 90) : null;
    });
    return list;
  }
  function rateLabel(d) { return d.aiRate === undefined ? '-' : d.aiRate === null ? '별도 협의' : Math.round(d.aiRate * 100) + '%'; }
  function productLabel(d) { return [d.ai ? 'Timely AI' : '', d.router ? 'Timely Router' : ''].filter(Boolean).join(' + '); }
  function dealStatus(d) {
    if (d.review.status === '반려') return { text: '반려', theme: 'red' };
    if (d.review.approvedAt) return { text: d.aiRate === null ? '승인 · 별도 협의' : '승인', theme: 'green' };
    return { text: '검토 중', theme: 'yellow' };
  }
  function metrics(deals) {
    var closed = deals.filter(function (d) { return d.stage === '계약 완료'; });
    return {
      sales: closed.reduce(function (a, d) { return a + (Number(d.ai) || 0) + (Number(d.router) || 0); }, 0),
      closed: closed.length,
      open: deals.length - closed.length,
      aiDiscount: closed.reduce(function (a, d) { return a + (d.aiRate ? Number(d.ai) * d.aiRate : 0); }, 0)
    };
  }
  function nextTier(tierName) {
    var i = TIERS.findIndex(function (t) { return t.name === tierName; });
    return TIERS[i + 1] || null;
  }

  /* ───────── 공용 UI 조각 ───────── */
  function P(cls, text) { return h('p', { className: cls }, text); }
  function Notice(props) {
    return h('div', { className: 'notice ' + (props.kind || ''), role: props.kind === 'danger' ? 'alert' : null },
      props.title ? h('p', { className: 'body-md-bold' }, props.title) : null,
      props.children ? h('div', { className: 'body-md-regular body', style: { marginTop: props.title ? 4 : 0 } }, props.children) : null);
  }
  function Field(props) {
    return h('div', { className: props.full ? 'full' : null },
      h(T.LabelContainer, { label: props.label, required: props.required, helperText: props.help, error: props.error }, props.children));
  }
  function Input(props) {
    return h(T.TextInput, Object.assign({ wrapperClassName: 'w-full' }, props, {
      value: props.value == null ? '' : props.value,
      onChange: function (e) { props.onValue(e.target.value); }
    }));
  }
  function MultiCheck(props) {
    var v = props.value || [];
    return h('div', { className: 'checks' }, props.options.map(function (o) {
      return h(T.Checkbox, {
        key: o, checked: v.indexOf(o) >= 0, suffix: h('span', { className: 'body-md-regular' }, o),
        onChange: function (c) { props.onValue(c ? v.concat([o]) : v.filter(function (x) { return x !== o; })); }
      });
    }));
  }
  function Radio(props) {
    return h('div', { className: 'checks' }, props.options.map(function (o) {
      return h(T.RadioButton, { key: o, checked: props.value === o, suffix: h('span', { className: 'body-md-regular' }, o), onClick: function () { props.onValue(o); } });
    }));
  }
  function DataTable(props) {
    return h('div', { className: 'table-scroll' },
      h(T.Table, { tableClassName: '!min-w-0' },
        h('thead', null, h('tr', null, props.cols.map(function (c) { return h(T.TH, { key: c }, c); }))),
        h('tbody', null, props.rows.length ? props.rows : h('tr', null, h(T.TD, { colSpan: props.cols.length }, h('div', { className: 'empty body-md-regular' }, props.empty || '아직 항목이 없어요.'))))));
  }
  function Kpi(label, value, note) {
    return h('div', { className: 'kpi', key: label },
      P('body-sm-medium muted', label), h('p', { className: 'head-sm-bold num' }, value), note ? P('body-sm-regular muted', note) : null);
  }
  function PageHead(title, desc, action) {
    return h('div', { className: 'between', style: { width: '100%' } },
      h('div', { className: 'stack-s' }, P('head-md-bold title', title), desc ? P('body-lg-regular muted', desc) : null),
      action || null);
  }
  // 저장·제출 전에 한 번 더 묻는 확인 팝업. 취소하면 아무것도 바뀌지 않는다.
  function ConfirmModal(props) {
    return h(T.Modal, { open: true, size: 'sm', title: props.title, subTitle: props.subTitle, onClose: props.busy ? function () {} : props.onCancel },
      h('div', { className: 'stack-s body-md-regular' },
        props.items ? h('dl', { className: 'kv', style: { gridTemplateColumns: '96px minmax(0, 1fr)' } }, props.items.filter(function (kv) { return kv[1]; }).map(function (kv) { return h(F, { key: kv[0] }, h('dt', null, kv[0]), h('dd', null, kv[1])); })) : null,
        props.note ? P('body-sm-regular muted', props.note) : null),
